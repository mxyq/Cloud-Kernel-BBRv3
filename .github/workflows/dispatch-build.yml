name: Dispatch Kernel Build From Request

# Lets a plain "git push" request a kernel build without an API token:
# drop a file named <kernel-version>.txt under .build-requests/ whose only
# content is the target architecture (x86_64 or arm64).
on:
  push:
    paths:
      - ".build-requests/*.txt"

permissions:
  contents: write

jobs:
  dispatch:
    name: Dispatch Kernel Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Workflow Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read Build Request
        id: request
        run: |
          # Inspect every commit in this push, not just the head: a push that
          # also touches code would otherwise look like it carries no request.
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse "$GITHUB_SHA^" 2>/dev/null || true)
          fi

          if [ -n "$base" ]; then
            changed=$(git diff-tree --no-commit-id --name-only -r "$base" "$GITHUB_SHA")
          else
            changed=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          fi

          file=$(printf '%s\n' "$changed" \
            | grep -E '^\.build-requests/[^/]+\.txt$' | head -n 1)
          if [ -z "$file" ]; then
            echo "No build request file in this push, nothing to do."
            echo "SKIP=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(sed -n 's/^version=//p' "$file" | head -n 1 | tr -d ' \t\r\n')
          arch=$(sed -n 's/^arch=//p' "$file" | head -n 1 | tr -d ' \t\r\n')
          diagnostic=$(sed -n 's/^diagnostic=//p' "$file" | head -n 1 | tr -d ' \t\r\n')
          diagnostic=${diagnostic:-false}

          if [ -z "$version" ] || [ -z "$arch" ]; then
            echo "Request file $file needs version= and arch= lines" >&2
            exit 1
          fi
          case "$arch" in
            x86_64|arm64) ;;
            *)
              echo "Invalid architecture in $file: '$arch'" >&2
              exit 1
              ;;
          esac
          case "$diagnostic" in
            true|false) ;;
            *)
              echo "Invalid diagnostic value in $file: '$diagnostic'" >&2
              exit 1
              ;;
          esac

          echo "Requested kernel $version for $arch (diagnostic=$diagnostic)"
          {
            echo "SKIP=false"
            echo "VERSION=$version"
            echo "ARCH=$arch"
            echo "DIAGNOSTIC=$diagnostic"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch Build Workflow
        if: steps.request.outputs.SKIP != 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: trigger-${{ steps.request.outputs.ARCH }}-build
          client-payload: '{"kernel_version": "${{ steps.request.outputs.VERSION }}", "diagnostic_build": "${{ steps.request.outputs.DIAGNOSTIC }}"}'
